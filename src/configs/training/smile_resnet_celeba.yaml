experiment_name: smile_resnet18_celeba
output_dir: output/smile_resnet_celeba

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  partition_file: null
  annotation_format: celeba
  image_column: image
  label_column: smile
  file_extension: ""
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  split_seed: 73
  num_workers: 8
  ood_exclude_attribute: null   # e.g. "Wearing_Hat" — excludes attr=1 from all splits
  # Equal balanced subsets — only active when ood_exclude_attribute is set.
  # Run notebook Celeba_attribute_analysis.ipynb cell 8 to get recommended values.
  # null = use all available samples (default, original behaviour).
  ood_train_subset_per_class: 9504   # 19,008 total train images per attr (50/50 smile) — bottleneck: No_Beard
  ood_test_subset_per_class:  136    # 272 total test  images per attr (50/50 smile) — bottleneck: Rosy_Cheeks

dataloader:
  batch_size: 128
  shuffle_train: true
  pin_memory: true

model:
  name: resnet18
  pretrained: true
  dropout: 0.1
  input_size: 224

train:
  seed: 73
  device: cuda
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  label_smoothing: 0.0
  save_every_n_epochs: 1

logging:
  log_every_n_steps: 50

wandb:
  enabled: true
  project: randomized-smoothing-smile
  entity: null
  run_name: smile_resnet18_celeba_20ep

checkpoint:
  keep_last_k: 2
  base_dir: output/pretrained_model/smile_resnet_celeba

smoothing_aug:
  enabled: false
  mode: manifold          # isotropic | manifold
  sigma: 0.25             # overridden per task by train_smooth_sweep.py
  knn_k: 500
  eps_eig: 1.0e-6
  index_path: output/smile_classification/celeba/index/pixel/annoy/euclidean/index.ann
  pca_cache_path: output/pca_cache/celeba/knn500_img_align_celeba_pca_cache.npz
  use_pca_cache: true