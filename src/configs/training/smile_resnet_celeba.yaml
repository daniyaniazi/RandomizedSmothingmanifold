experiment_name: smile_resnet18_celeba
output_dir: output

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  partition_file: null
  annotation_format: celeba
  image_column: image
  label_column: smile
  file_extension: ""
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  split_seed: 73
  num_workers: 8

dataloader:
  batch_size: 128
  shuffle_train: true
  pin_memory: true

model:
  name: resnet18
  pretrained: true
  dropout: 0.1
  input_size: 224

train:
  seed: 73
  device: cuda
  epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  label_smoothing: 0.0
  save_every_n_epochs: 1

logging:
  log_every_n_steps: 50

wandb:
  enabled: true
  project: randomized-smoothing-smile
  entity: null
  run_name: smile_resnet18_celeba_20ep

checkpoint:
  keep_last_k: 2
  base_dir: output/pretrained_model