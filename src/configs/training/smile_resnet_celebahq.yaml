experiment_name: smile_resnet18_celebahq
output_dir: output/smile_resnet_celebahq

dataset:
  name: CelebA-HQ
  root_dir: /BS/databases08/CelebA-HQ/data512x512
  image_dir: train
  annotation_file: /BS/dniazi_thesis/work/RandomizedSmothingmanifold/input/datasets/celebAHQ/Anno/list_attr_celeba_hq.txt
  partition_file: null
  annotation_format: celeba
  image_column: image
  label_column: smile
  file_extension: .jpg
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  split_seed: 73
  num_workers: 8

dataloader:
  batch_size: 64
  shuffle_train: true
  pin_memory: true

model:
  name: resnet18
  pretrained: true
  dropout: 0.1
  input_size: 512  # native CelebA-HQ resolution

train:
  seed: 73
  device: cuda
  epochs: 30  # more epochs needed at higher resolution
  lr: 0.00005  # lower LR for 512x512 stability
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  label_smoothing: 0.0
  save_every_n_epochs: 1

logging:
  log_every_n_steps: 50

wandb:
  enabled: true
  project: randomized-smoothing-smile
  entity: null
  run_name: smile_resnet18_celebahq_512_30ep

checkpoint:
  keep_last_k: 2
  base_dir: output/pretrained_model/smile_resnet_celebahq_512