# VAE training config for CelebA-HQ at 128x128 resolution
# Fair comparison with CelebA at same resolution

experiment_name: vae_celebahq_128
output_dir: output/vae_celebahq_128

dataset:
  name: CelebA-HQ
  root_dir: /BS/databases08/CelebA-HQ/data512x512
  image_dir: train
  file_extension: .jpg
  num_workers: 8

dataloader:
  batch_size: 64
  shuffle_train: true
  pin_memory: true

model:
  in_channels: 3
  image_size: 128  # Same as CelebA config for fair comparison
  latent_dim: 256  # Same as CelebA config for fair comparison

train:
  seed: 73
  device: cuda
  epochs: 30
  lr: 0.0005
  weight_decay: 0.0
  beta: 0.0001

logging:
  log_every_n_steps: 50

wandb:
  enabled: false
  project: randomized-smoothing-vae
  entity: null
  run_name: vae_celebahq_128_30ep

checkpoint:
  save_every_n_epochs: 1
  keep_last_k: 2
  base_dir: output/pretrained_model/vae_celebahq_128
