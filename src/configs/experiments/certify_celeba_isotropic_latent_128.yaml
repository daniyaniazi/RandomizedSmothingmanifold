# CelebA Certification - Latent Space Isotropic (Gaussian) Smoothing
# Baseline: standard Gaussian noise in VAE latent space (no manifold)

experiment_name: certify_celeba_isotropic_latent_128
seed: 73
device: cuda
alpha_conf: 0.001

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  annotation_format: celeba
  file_extension: ""
  num_workers: 4
  subset_size: 100
  # OOD attribute subset — must match latent manifold config for fair comparison
  ood_attribute: Wearing_Hat   # e.g. "Wearing_Hat", "Male", null = standard test split
  ood_balanced: true
  ood_seed: 73

model:
  name: resnet18
  checkpoint_path: output/pretrained_model/smile_resnet_celeba/best.pt
  input_size: 224
  num_classes: 1
  dropout: 0.1

vae:
  enabled: true
  checkpoint_path: output/pretrained_model/vae_celeba_128/best.pt
  image_size: 128
  latent_dim: 256
  in_channels: 3

smoothing:
  mode: latent
  sigma: 0.5  # default sigma
  sigma_values: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  n0_samples: 100
  n_samples: 250
  knn_k: 150         # ignored when use_manifold=false
  eps_eig: 1.0e-06   # ignored when use_manifold=false
  use_manifold: false  # KEY: isotropic Gaussian noise in latent space

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null
  latent_index_path: null
  build_if_missing: true

output:
  output_dir: output
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10

checkpoint:
  enabled: true
  checkpoint_every: 50
  resume: false
