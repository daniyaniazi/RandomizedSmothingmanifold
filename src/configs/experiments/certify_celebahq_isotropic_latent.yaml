# CelebA-HQ Certification - Latent Space Isotropic (Gaussian) Smoothing
# Baseline: standard Gaussian noise in VAE latent space (no manifold)

experiment_name: certify_celebahq_isotropic_latent
seed: 73
device: cuda
alpha_conf: 0.001

dataset:
  name: CelebA-HQ
  root_dir: /BS/databases08/CelebA-HQ/data512x512
  image_dir: train
  annotation_file: /BS/dniazi_thesis/work/RandomizedSmothingmanifold/input/datasets/celebAHQ/Anno/list_attr_celeba_hq.txt
  annotation_format: celeba
  file_extension: .jpg
  num_workers: 4
  subset_size: 500

model:
  name: resnet18
  checkpoint_path: output/pretrained_model/smile_resnet_celebahq_512/best.pt
  input_size: 512
  num_classes: 1
  dropout: 0.1

vae:
  enabled: true
  checkpoint_path: output/pretrained_model/vae_celebahq_512/best.pt
  image_size: 512  # must match trained VAE
  latent_dim: 1024  # must match trained VAE
  in_channels: 3

smoothing:
  mode: latent
  sigma: 0.5  # default sigma
  sigma_values: [0.25, 0.50, 0.75, 1.00]  # for sweep experiments
  n_samples: 100
  knn_k: 500
  eps_eig: 1.0e-06
  use_manifold: false  # KEY: isotropic Gaussian noise in latent space

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null
  latent_index_path: null
  build_if_missing: true

output:
  output_dir: output
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10

checkpoint:
  enabled: true
  checkpoint_every: 50
  resume: false
