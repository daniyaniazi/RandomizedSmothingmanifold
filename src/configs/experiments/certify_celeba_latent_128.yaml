# CelebA Certification - Latent Space Manifold Smoothing (128x128 VAE)
# Uses VAE encoder/decoder for smoothing in learned latent space

experiment_name: certify_celeba_latent_manifold_128
seed: 73
device: cuda
alpha_conf: 0.001

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  annotation_format: celeba
  file_extension: ""
  num_workers: 4
  subset_size: 500

model:
  name: resnet18
  checkpoint_path: output/pretrained_model/smile_resnet_celeba/best.pt
  input_size: 224
  num_classes: 1
  dropout: 0.1  # must match training config

vae:
  enabled: true
  checkpoint_path: output/pretrained_model/vae_celeba_128/best.pt
  image_size: 128
  latent_dim: 256
  in_channels: 3

smoothing:
  mode: latent
  sigma: 0.5  # default sigma (used if not overridden)
  sigma_values: [0.25, 0.50, 0.75, 1.00]  # for sweep experiments
  n_samples: 100
  knn_k: 500
  eps_eig: 1.0e-06
  use_manifold: true

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null
  latent_index_path: null  # will be built using VAE encoder
  build_if_missing: true

output:
  output_dir: output  # Results go to output/smile_classification/celeba/
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10

# Checkpoint settings for long-running jobs
checkpoint:
  enabled: true
  checkpoint_every: 50  # save progress every 100 samples
  resume: false  # set to true to resume from last checkpoint
