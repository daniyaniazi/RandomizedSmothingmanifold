# CelebA-HQ Certification - Latent Space Manifold Smoothing (128x128 VAE)
# Uses VAE trained on CelebA-HQ for latent smoothing

experiment_name: certify_celebahq_latent_manifold_128
seed: 73
device: cuda
alpha_conf: 0.001

dataset:
  name: CelebA-HQ
  root_dir: /BS/databases08/CelebA-HQ/data512x512
  image_dir: train
  annotation_file: /BS/dniazi_thesis/work/RandomizedSmothingmanifold/input/datasets/celebAHQ/Anno/list_attr_celeba_hq.txt
  annotation_format: celeba
  file_extension: .jpg
  num_workers: 4
  subset_size: 1000

model:
  name: resnet18
  checkpoint_path: output/pretrained_model/smile_resnet_celebahq/best.pt
  input_size: 224
  num_classes: 1

vae:
  enabled: true
  checkpoint_path: output/pretrained_model/vae_celebahq_128/best.pt
  image_size: 128
  latent_dim: 256
  in_channels: 3

smoothing:
  mode: latent
  sigma: 0.5
  n_samples: 100
  knn_k: 64
  eps_eig: 1.0e-06
  use_manifold: true

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null
  latent_index_path: null
  build_if_missing: true

output:
  output_dir: output  # Results go to output/smile_classification/celebahq/
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10
