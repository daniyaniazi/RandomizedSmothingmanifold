# CelebA Certification - Pixel Space Isotropic (Gaussian) Smoothing
# Baseline: standard Gaussian noise without manifold awareness

experiment_name: certify_celeba_isotropic_pixel
seed: 73
device: cuda
alpha_conf: 0.001

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  annotation_format: celeba
  file_extension: ""
  num_workers: 4
  subset_size: 100
  # OOD attribute — must match certify_celeba_pixel.yaml for fair iso vs manifold comparison
  ood_attribute: null
  ood_balanced: true
  ood_seed: 73
  split_seed: 73               # must match training split_seed to ensure same train/test split

model:
  name: resnet18
  checkpoint_path: output/pretrained_model/smile_resnet_celeba/best.pt
  input_size: 224
  num_classes: 1
  dropout: 0.1

vae:
  enabled: false

smoothing:
  mode: pixel
  sigma: 0.10  # default sigma
  # sigma_values: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.50, 2.00]
  sigma_values: [0.10,  0.20, 0.30,  0.40,  0.50,  0.60,  0.70, 0.80,  0.90,  1.00]  
  # sigma_values: [0.70]
  n0_samples: 30
  n_samples: 100
  knn_k: 500         # ignored when use_manifold=false
  eps_eig: 1.0e-06   # ignored when use_manifold=false
  use_manifold: false  # KEY: isotropic Gaussian noise

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null
  latent_index_path: null
  build_if_missing: true  # not needed but harmless

output:
  output_dir: output
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10

checkpoint:
  enabled: true
  checkpoint_every: 10
  resume: true
