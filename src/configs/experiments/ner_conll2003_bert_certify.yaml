experiment_name: ner_conll2003_bert_certify
output_dir: output/ner_conll2003_bert

task:
  name: ner
  module: src.models.transformer.ner.train

dataset:
  name: conll2003
  split_train: train
  split_val: validation
  split_test: test
  text_field: tokens
  label_field: ner_tags
  max_length: 192
  num_workers: 4

dataloader:
  batch_size: 16
  shuffle_train: false

model:
  encoder_name: bert-base-uncased
  dropout: 0.1

smoothing:
  enabled: true
  mode: manifold
  target: hidden_states
  sigma: 0.75  # default sigma
  sigma_values: [0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20, 1.25, 1.35, 1.50]  # dense sweep + high-sigma tail
  layer_index: null        # use last hidden layer
  knn_k: 64
  eps_eig: 1.0e-06
  index_backend: annoy
  index_metric: euclidean
  index_path: null
  refresh_index: false
  index_n_trees: 50

certification:
  enabled: true
  alpha: 0.001             # Clopper-Pearson confidence level
  n0: 100                  # pilot samples for label selection
  n: 250                   # samples for certification per token
  abstain_label: -1

train:
  seed: 73
  lr: 3.0e-05
  weight_decay: 0.01
  epochs: 20
  device: cuda
  grad_clip_norm: 1.0

eval:
  max_batches: null     # using test_subset instead
  test_subset: 0.7       # fraction of test set to use (0.1 = 10%), null for full test set

wandb:
  enabled: true
  project: randomized-smoothing-ner
