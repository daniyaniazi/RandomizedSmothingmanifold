# CelebA Certification - Pixel Space Manifold Smoothing (128x128)
# Compare with CelebA-HQ to evaluate dataset quality impact

experiment_name: certify_celeba_pixel_manifold
seed: 73
device: cuda
alpha_conf: 0.001  # confidence level for certification bounds

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  annotation_format: celeba
  file_extension: ""
  num_workers: 4
  subset_size: 100  # use subset for faster testing, set null for full dataset
  # OOD attribute subset settings
  # Set ood_attribute to restrict test images to those where the attribute=1
  # The subset will be balanced: 50 smile + 50 non-smile (requires subset_size=100)
  ood_attribute: High_Cheekbones          # e.g. "Male", "Eyeglasses", "Wearing_Hat", null = standard test split
  ood_balanced: true           # if true: sample exactly subset_size/2 smile + subset_size/2 non-smile
  ood_seed: 73                 # random seed for OOD sampling
  split_seed: 73               # must match training split_seed to ensure same train/test split

model:
  name: resnet18
  # --- Option A: explicit checkpoint (use_smoothed_classifier: false) ---
  checkpoint_path: output/pretrained_model/smile_resnet_celeba/best.pt
  # --- Option B: auto-resolve sigma-matched checkpoint ---
  # Set use_smoothed_classifier: true and the path is built automatically as:
  #   {smoothed_classifier_base_dir}/{isotropic|manifold}/smile_resnet_celeba_sigma_{s}/best.pt
  use_smoothed_classifier: false
  smoothed_classifier_base_dir: output/pretrained_model
  input_size: 224
  num_classes: 1
  dropout: 0.1  # must match training config

vae:
  enabled: false  # not needed for pixel smoothing

smoothing:
  mode: pixel
  sigma: 0.10  # default sigma
  # sigma_values: [0.01, 0.03, 0.05, 0.07, 0.10, 0.12, 0.15, 0.17, 0.20, 0.22, 0.25, 0.27, 0.30, 0.32, 0.35, 0.37, 0.40, 0.42, 0.45, 0.47, 0.50, 0.55]  # 22 values 0.01–0.55
  sigma_values: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.50, 2.00]  # 17 values 0.20–1.00
  n0_samples: 30
  n_samples: 100
  knn_k: 500
  eps_eig: 1.0e-06
  use_manifold: true  # true = local PCA manifold, false = isotropic

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null  # will be built if missing
  latent_index_path: null
  build_if_missing: true

output:
  output_dir: output  # Results go to output/smile_classification/celeba/
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10

# Checkpoint settings for long-running jobs
checkpoint:
  enabled: true
  checkpoint_every: 10  # save progress every 10 samples
  resume: true  # resume from last checkpoint for repeated / restarted runs
