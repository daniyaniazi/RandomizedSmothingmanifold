experiment_name: ner_conll2003_bert_isotropic_certify_layer_0
output_dir: output/ner_conll2003_bert

task:
  name: ner
  module: src.models.transformer.ner.train

dataset:
  name: conll2003
  split_train: train
  split_val: validation
  split_test: test
  text_field: tokens
  label_field: ner_tags
  max_length: 192
  num_workers: 4

dataloader:
  batch_size: 16
  shuffle_train: false

model:
  encoder_name: bert-base-uncased
  dropout: 0.1

smoothing:
  enabled: true
  mode: isotropic
  target: hidden_states
  sigma: 0.50
  layer_index: 0

certification:
  enabled: true
  alpha: 0.001
  n0: 64
  n: 100
  abstain_label: -1

train:
  seed: 73
  lr: 3.0e-05
  weight_decay: 0.01
  epochs: 20
  device: cuda
  grad_clip_norm: 1.0

eval:
  max_batches: null
  test_subset: 0.7

wandb:
  enabled: true
  project: randomized-smoothing-ner
