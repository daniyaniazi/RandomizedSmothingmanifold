experiment_name: ner_conll2003_bert_masking_certify
output_dir: output/ner_conll2003_bert

task:
  name: ner
  module: src.models.transformer.ner.train

dataset:
  name: conll2003
  split_train: train
  split_val: validation
  split_test: test
  text_field: tokens
  label_field: ner_tags
  max_length: 192
  num_workers: 4

dataloader:
  batch_size: 16
  shuffle_train: false

model:
  encoder_name: bert-base-uncased
  dropout: 0.1

smoothing:
  enabled: true
  mode: manifold
  target: hidden_states
  sigma: 0.20
  layer_index: null
  knn_k: 32
  eps_eig: 1.0e-06
  index_backend: annoy
  index_metric: euclidean
  index_path: /BS/dniazi_thesis/work/RandomizedSmothingmanifold/output/ner_conll2003_bert/ner_bert_conll2003_finetune/token_index_train/euclidean/annoy_index.ann
  index_artifacts_dir: /BS/dniazi_thesis/work/RandomizedSmothingmanifold/output/ner_conll2003_bert/ner_bert_conll2003_finetune/token_index_train
  refresh_index: false
  index_n_trees: 50

certification:
  enabled: true
  alpha: 0.001
  n0: 64
  n: 100
  abstain_label: -1

eval:
  max_batches: 50

masking:
  enabled: true
  mode: context           # context | entity | hybrid
  entity_label_ids: [1]   # label id 1 by your request; update as needed
  mask_ratio: 0.15
  max_masks_per_sentence: null
  cap_by_batch_avg_tokens: true
  seed: 73

train:
  seed: 73
  lr: 3.0e-05
  weight_decay: 0.01
  epochs: 5
  device: cuda
  grad_clip_norm: 1.0

wandb:
  enabled: false
  project: randomized-smoothing-ner
