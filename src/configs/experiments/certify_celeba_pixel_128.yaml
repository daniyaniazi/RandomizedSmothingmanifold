# CelebA Certification - Pixel Space Manifold Smoothing (128x128)
# Compare with CelebA-HQ to evaluate dataset quality impact

experiment_name: certify_celeba_pixel_manifold_128
seed: 73
device: cuda
alpha_conf: 0.001  # confidence level for certification bounds

dataset:
  name: CelebA
  root_dir: /BS/databases08/CelebA
  image_dir: img_align_celeba
  annotation_file: Anno/list_attr_celeba.txt
  annotation_format: celeba
  file_extension: ""
  num_workers: 4
  subset_size: 1000  # use subset for faster testing, set null for full dataset

model:
  name: resnet18
  checkpoint_path: output/pretrained_model/smile_resnet_celeba/best.pt
  input_size: 224
  num_classes: 1

vae:
  enabled: false  # not needed for pixel smoothing

smoothing:
  mode: pixel
  sigma: 0.25
  n_samples: 100
  knn_k: 64
  eps_eig: 1.0e-06
  use_manifold: true  # true = local PCA manifold, false = isotropic

index:
  backend: annoy
  metric: euclidean
  n_trees: 50
  pixel_index_path: null  # will be built if missing
  latent_index_path: null
  build_if_missing: true

output:
  output_dir: output  # Results go to output/smile_classification/celeba/
  save_results: true
  save_per_sample: true
  save_visualizations: true
  num_viz_samples: 10

# Checkpoint settings for long-running jobs
checkpoint:
  enabled: true
  checkpoint_every: 100  # save progress every 100 samples
  resume: false  # set to true to resume from last checkpoint
