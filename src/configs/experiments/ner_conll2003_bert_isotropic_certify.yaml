experiment_name: ner_conll2003_bert_isotropic_certify
output_dir: output/ner_conll2003_bert

task:
  name: ner
  module: src.models.transformer.ner.train

dataset:
  name: conll2003
  split_train: train
  split_val: validation
  split_test: test
  text_field: tokens
  label_field: ner_tags
  max_length: 192
  num_workers: 4

dataloader:
  batch_size: 16
  shuffle_train: false

model:
  encoder_name: bert-base-uncased
  dropout: 0.1

smoothing:
  enabled: true
  mode: isotropic          # Gaussian isotropic noise (not manifold-aware)
  target: hidden_states
  sigma: 0.75  # default sigma
  sigma_values: [2.00, 2.25, 2.50, 2.75, 3.00, 3.25, 3.50, 3.75, 4.00, 4.25] # dense sweep + high-sigma tail  # dense sweep + high-sigma tail
  layer_index: null        # use last hidden layer
  knn_k: 64               # not used in isotropic mode, but kept aligned with manifold config

certification:
  enabled: true
  alpha: 0.001             # Clopper-Pearson confidence level
  n0: 100                  # pilot samples for label selection
  n: 250                   # samples for certification per token
  abstain_label: -1

train:
  seed: 73
  lr: 3.0e-05
  weight_decay: 0.01
  epochs: 20
  device: cuda
  grad_clip_norm: 1.0

eval:
  max_batches: null     # using test_subset instead
  test_subset: 0.7        # fraction of test set to use

wandb:
  enabled: true
  project: randomized-smoothing-ner
