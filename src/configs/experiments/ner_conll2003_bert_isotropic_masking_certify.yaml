experiment_name: ner_conll2003_bert_isotropic_masking_certify
output_dir: output/ner_conll2003_bert

task:
  name: ner
  module: src.models.transformer.ner.train

dataset:
  name: conll2003
  split_train: train
  split_val: validation
  split_test: test
  text_field: tokens
  label_field: ner_tags
  max_length: 192
  num_workers: 4

dataloader:
  batch_size: 16
  shuffle_train: false

model:
  encoder_name: bert-base-uncased
  dropout: 0.1

smoothing:
  enabled: true
  mode: isotropic          # Gaussian isotropic noise (not manifold-aware)
  target: hidden_states
  sigma: 0.20  # default sigma
  sigma_values: [0.25, 0.50, 0.75, 1.00]  # for sweep experiments
  layer_index: null        # use last hidden layer

certification:
  enabled: true
  alpha: 0.001
  n0: 64
  n: 100
  abstain_label: -1

eval:
  max_batches: null     # using test_subset instead
  test_subset: 0.7         # fraction of test set to use

masking:
  enabled: true
  mode: context            # context | entity | hybrid
  entity_label_ids: [1]    # label id for entities to mask
  mask_ratio: 0.15
  max_masks_per_sentence: null
  cap_by_batch_avg_tokens: true
  seed: 73

train:
  seed: 73
  lr: 3.0e-05
  weight_decay: 0.01
  epochs: 20
  device: cuda
  grad_clip_norm: 1.0

wandb:
  enabled: true
  project: randomized-smoothing-ner
